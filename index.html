    document.addEventListener('submit',e=>{const f=e.target;
      if(f.id==='stock-form'){e.preventDefault();const d=new FormData(f);const id=f.dataset.id;const pn=String(d.get('partNumber')).trim();if(!id&&db.stock.some(x=>normPn(x.partNumber)===normPn(pn))){toast('That part is already tracked.');return}const rec={...(id?db.stock.find(x=>x.id===id):{id:uid(),adjust:0}),partNumber:pn,description:String(d.get('description')||'').trim()||plFind(pn)?.desc||'',opening:num(d.get('opening')),minQty:num(d.get('minQty')),location:String(d.get('location')||'').trim(),cost:num(d.get('cost'))};db.stock=id?db.stock.map(x=>x.id===id?rec:x):[...db.stock,rec];save();closeModal();render();toast(id?'Saved.':'Part added to stock.');return}
      if(f.id==='adjust-form'){e.preventDefault();const r=stockRows().find(x=>x.id===f.dataset.id);const s=db.stock.find(x=>x.id===f.dataset.id);if(!r||!s)return;const count=Number(new FormData(f).get('count'))||0;s.adjust=(Number(s.adjust)||0)+(count-r.qty);save();closeModal();render();toast(`Stock set to ${count}.`);return}
      if(f.id==='purchase-form'){e.preventDefault();if(!f.reportValidity())return;const d=new FormData(f);const id=f.dataset.id;const items=[...document.querySelectorAll('#p-lines .p-row')].map(readPLine).filter(x=>x.partNumber||x.description).map(x=>({...x,description:x.description||x.partNumber}));if(!items.length){toast('Add at least one part.');return}
        const rec={...(id?db.purchases.find(x=>x.id===id):{id:uid(),createdAt:new Date().toISOString()}),supplier:String(d.get('supplier')).trim(),billNo:String(d.get('billNo')||'').trim(),date:d.get('date')||today(),gstin:String(d.get('gstin')||'').trim().toUpperCase(),paid:d.get('paid')==='on',notes:String(d.get('notes')||'').trim(),items};
        db.purchases=id?db.purchases.map(x=>x.id===id?rec:x):[...db.purchases,rec];let added=0;
        if(d.get('track')==='on')items.forEach(x=>{if(x.partNumber&&!db.stock.some(s=>normPn(s.partNumber)===normPn(x.partNumber))){db.stock.push({id:uid(),partNumber:x.partNumber,description:x.description,opening:0,minQty:1,location:'',cost:0,adjust:0});added++}});
        save();closeModal();page='purchases';render();toast(`Purchase saved${added?` — ${added} new part${added===1?'':'s'} now tracked in stock`:''}.`);return}
      if(f.id==='expense-form'){e.preventDefault();const d=new FormData(f);db.expenses.push({id:uid(),date:d.get('date')||today(),amount:num(d.get('amount')),category:d.get('category'),mode:d.get('mode'),note:String(d.get('note')||'').trim()});expMonth=(d.get('date')||today()).slice(0,7);save();render();toast('Expense added.');document.querySelector('#expense-form [name=amount]')?.focus();return}
    });

    // Enter in a purchase line adds a new line instead of submitting the form.
    document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.tagName==='INPUT'&&t.form?.id==='purchase-form'){e.preventDefault();if(t.closest('.p-row'))document.querySelector('[data-p-add]').click()}},true);

    // ---- Events
    document.addEventListener('click',e=>{
      const t=e.target;const pageBtn=t.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;searchText='';render();return}
      const pageLink=t.closest('[data-page-link]');if(pageLink){e.preventDefault();page=pageLink.dataset.pageLink;searchText='';render();return}
      if(t.closest('[data-action="new-invoice"]')){e.preventDefault();showBuilder();return}
      if(t.closest('[data-action="new-estimate"]')){showBuilder(null,{type:'estimate'});return}
      if(t.closest('[data-recv-full]')){const f=document.getElementById('invoice-form');f.receivedNow.value=totals({...formFlags(),items:[...document.querySelectorAll('#line-items .line-row')].map(readLine)}).total.toFixed(2);refreshTotals();return}
      const dup=t.closest('[data-duplicate]');if(dup){const o=db.invoices.find(x=>x.id===dup.dataset.duplicate);if(o){closeModal();showBuilder(null,{type:o.type||'bill',machineRef:o.machineRef,notes:o.notes,items:(o.items||[]).map(x=>({...x,id:uid()})),customer:{name:o.customerName,phone:o.customerPhone,email:o.customerEmail,address:o.customerAddress,gstin:o.customerGstin}})}return}
      const conv=t.closest('[data-convert]');if(conv){const i=db.invoices.find(x=>x.id===conv.dataset.convert);if(i){const from=i.number;i.type='bill';i.number=invNumber('bill');i.date=today();i.notes=[i.notes,'From estimate '+from].filter(Boolean).join('\n');i.payments=[];syncPaid(i);save();render();showDetail(i.id);toast(`Estimate ${from} is now bill ${i.number}.`)}return}
      const rp=t.closest('[data-record-pay]');if(rp){showPayment(rp.dataset.recordPay);return}
      const bp=t.closest('[data-bill-part]');if(bp){showBuilder(null,{items:[{...JSON.parse(bp.dataset.billPart),id:uid()}]});return}
      const bc=t.closest('[data-bill-customer]');if(bc){showBuilder(null,{customer:customerRows().find(c=>c.name===bc.dataset.billCustomer)});return}
      if(t.closest('[data-close]')){closeModal();return}
      const sg=t.closest('[data-sg]');if(sg){chooseSuggest(+sg.dataset.sg);document.getElementById('add-part').focus();return}
      if(t.closest('[data-add-labour]')){addLine({kind:'Service',description:'',qty:1,rate:0,disc:0,taxRate:num(db.settings.taxRate)},'.desc-input');return}
      const remove=t.closest('.remove');if(remove){remove.closest('.line-row').remove();refreshTotals();return}
      const open=t.closest('[data-open],[data-open-btn]');if(open){showDetail(open.dataset.open||open.dataset.openBtn);return}
      const edit=t.closest('[data-edit]');if(edit){closeModal();showBuilder(edit.dataset.edit);return}
      const print=t.closest('[data-action="print"]');if(print){printInvoice(print.dataset.id);return}
      const share=t.closest('[data-share]');if(share){shareInvoice(share.dataset.id,share.dataset.share);return}
      const paid=t.closest('[data-mark-paid]');if(paid){showPayment(paid.dataset.markPaid,true);return}
      const unpaid=t.closest('[data-mark-unpaid]');if(unpaid){const i=db.invoices.find(x=>x.id===unpaid.dataset.markUnpaid);if(i){i.paid=false;i.payments=[];delete i.paidAt;save();showDetail(i.id);render();toast('Bill marked as unpaid.')}return}
      const delInv=t.closest('[data-delete-invoice]');if(delInv){confirmModal('Delete this bill?','This removes the bill from this device. This cannot be undone.','invoice:'+delInv.dataset.deleteInvoice);return}
      const delItem=t.closest('[data-delete-item]');if(delItem){confirmModal('Remove this item?','It is only removed from your saved list. Existing bills are unchanged.','item:'+delItem.dataset.deleteItem,'Remove');return}
      const confirm=t.closest('[data-confirm]');if(confirm){const action=confirm.dataset.confirm;if(action==='clear'){db=structuredClone(defaults);save();closeModal();render();toast('Bills and settings cleared.');return}const [kind,id]=action.split(':');if(kind==='pricelist'){closeModal();removeList(id);return}if(kind==='invoice')db.invoices=db.invoices.filter(x=>x.id!==id);if(kind==='item')db.catalog=db.catalog.filter(x=>x.id!==id);if(kind==='purchase')db.purchases=db.purchases.filter(x=>x.id!==id);save();closeModal();render();toast({invoice:'Bill deleted.',purchase:'Purchase deleted.'}[kind]||'Item removed.');return}
      if(t.closest('[data-action="export-csv"]')){exportCSV();return}
      if(t.closest('[data-action="backup"]')){db.settings.lastBackup=today();save();download('forgeflow-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded. Keep a copy somewhere safe, like Google Drive.');return}
      if(t.closest('[data-action="restore"]')){document.getElementById('restore-file').click();return}
      if(t.closest('[data-action="clear-data"]')){confirmModal('Clear all bills and settings?','This permanently removes your bills, saved items and settings from this browser. Download a backup first if you need one.','clear','Clear everything');return}
      if(t.closest('[data-action="upload-pricelist"]')){uploadTarget=null;document.getElementById('pricelist-file').click();return}
      const upList=t.closest('[data-upload-list]');if(upList){uploadTarget=upList.dataset.uploadList;document.getElementById('pricelist-file').click();return}
      const rmList=t.closest('[data-remove-list]');if(rmList){const l=priceList.lists.find(x=>x.id===rmList.dataset.removeList);if(l)confirmModal(`Remove ${esc(l.name)}?`,`Its ${l.rows.length.toLocaleString('en-IN')} parts will no longer show in searches${window.Cloud?.enabled?' on any device':''}. Bills already made keep their prices.`,'pricelist:'+l.id,'Remove list');return}
      const rnList=t.closest('[data-rename-list]');if(rnList){const l=priceList.lists.find(x=>x.id===rnList.dataset.renameList);if(l){openModal(`<form id="rename-list-form" data-id="${esc(l.id)}"><div class="modal-head"><div><h2>Rename price list</h2></div><button type="button" class="close" data-close>×</button></div><div class="modal-body"><label>List name</label><input class="field" name="name" value="${esc(l.name)}" required maxlength="80" placeholder="e.g. Atlas Copco MRP"></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save name</button></div></form>`,'narrow');setTimeout(()=>document.querySelector('#rename-list-form [name=name]')?.select(),30)}return}
      if(!t.closest('.pick-wrap')){const b=document.getElementById('add-suggest');if(b)b.innerHTML=''}
    });
    document.addEventListener('input',e=>{const t=e.target;
      if(t.id==='lookup'){lookupText=t.value;refreshLookup();return}
      if(t.id==='catalog-search'){catalogSearch=t.value;refreshCatalog();return}
      if(t.id==='add-part'){showSuggest();return}
      if(t.id==='invoice-search'||t.id==='customer-search'){searchText=t.value;const pos=t.selectionStart;render();const n=document.getElementById(t.id);n?.focus();n?.setSelectionRange(pos,pos);return}
      if(t.closest('#line-items')||t.name==='receivedNow')refreshTotals();
      if(t.name==='customerName'){const c=customerRows().find(c=>c.name.toLowerCase()===t.value.trim().toLowerCase());if(c){const f=t.form;[['customerPhone','phone'],['customerEmail','email'],['customerAddress','address'],['customerGstin','gstin']].forEach(([k,v])=>{if(!f[k].value&&c[v])f[k].value=c[v]})}}
    });
    document.addEventListener('keydown',e=>{const t=e.target;
      if(t.id==='add-part'){if(e.key==='ArrowDown'){e.preventDefault();moveSuggest(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveSuggest(-1)}else if(e.key==='Enter'){e.preventDefault();chooseSuggest(sgIndex)}else if(e.key==='Escape'&&t.value){e.preventDefault();e.stopPropagation();t.value='';showSuggest()}return}
      if(e.key==='Enter'&&t.tagName==='INPUT'&&t.form?.id==='invoice-form'){e.preventDefault();document.getElementById('add-part')?.focus();return}
      if(e.key==='Escape'&&document.querySelector('.modal-layer')){closeModal();return}
      if(!document.querySelector('.modal-layer')&&!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(e.key==='n'||e.key==='N'){e.preventDefault();showBuilder()}else if(e.key==='/'){e.preventDefault();if(!document.querySelector('#lookup,#catalog-search,#invoice-search,#customer-search')){page='overview';render()}document.querySelector('#lookup,#catalog-search,#invoice-search,#customer-search')?.focus()}}
    });
    document.addEventListener('change',async e=>{const t=e.target;
      if(t.id==='catalog-list'){catalogList=t.value;refreshCatalog();return}
      if(t.id==='invoice-filter'){invoiceFilter=t.value;render();document.getElementById('invoice-filter').value=invoiceFilter;return}
      if(t.form?.id==='invoice-form'&&t.name==='docType'){const f=t.form;document.getElementById('recv-wrap')?.classList.toggle('hidden',t.value==='estimate');const old=f.dataset.id&&db.invoices.find(x=>x.id===f.dataset.id);document.getElementById('builder-title').innerHTML=builderTitle(!!old,t.value,old&&(old.type||'bill')===t.value?old.number:invNumber(t.value));refreshTotals();return}
      if(t.form?.id==='invoice-form'&&['inclusive','roundOff','gstType'].includes(t.name)){refreshTotals();return}
      if(t.id==='pricelist-file'){const file=t.files[0];if(!file)return;try{await importPriceList(file,uploadTarget)}catch(err){toast(err?.message||'Could not read the spreadsheet. Try .xlsx or .csv.')}t.value='';return}
    });
    let afterSave='none';document.addEventListener('click',e=>{const b=e.target.closest('#invoice-form [type=submit]');if(b)afterSave=b.dataset.after},true);
    document.addEventListener('submit',e=>{
      if(e.target.id==='invoice-form'){e.preventDefault();const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);const id=f.dataset.id;const old=id?db.invoices.find(x=>x.id===id):null;const items=[...document.querySelectorAll('#line-items .line-row')].map(readLine).filter(x=>x.description||x.partNumber).map(x=>({...x,description:x.description||x.partNumber}));if(!items.length){toast('Add at least one part or labour line.');document.getElementById('add-part').focus();return}
        const type=data.get('docType')==='estimate'?'estimate':'bill';const inv={...(old||{}),type,id:old?.id||uid(),number:old&&(old.type||'bill')===type?old.number:invNumber(type),customerName:String(data.get('customerName')||'').trim(),customerPhone:String(data.get('customerPhone')||'').trim(),customerEmail:String(data.get('customerEmail')||'').trim(),customerAddress:String(data.get('customerAddress')||'').trim(),customerGstin:String(data.get('customerGstin')||'').trim().toUpperCase(),machineRef:String(data.get('machineRef')||'').trim(),date:data.get('date')||today(),dueDate:data.get('dueDate')||'',gstType:data.get('gstType')||'',inclusive:f.inclusive.checked,roundOff:f.roundOff.checked,notes:String(data.get('notes')||'').trim(),items,createdAt:old?.createdAt||new Date().toISOString()};
        if(type==='estimate'){inv.payments=[];inv.paid=false}else if(!old){const r=Math.min(num(data.get('receivedNow')),totals(inv).total);inv.payments=r>=0.005?[{date:inv.date,amount:Math.round(r*100)/100,mode:String(data.get('payMode')||'Cash')}]:[]}
        syncPaid(inv);
        if(old)db.invoices=db.invoices.map(x=>x.id===id?inv:x);else db.invoices.push(inv);save();closeModal();page='invoices';render();toast(old?'Saved.':`${type==='estimate'?'Estimate':'Bill'} ${inv.number} saved.`);if(afterSave==='print')printInvoice(inv.id);else showDetail(inv.id);return}
      if(e.target.id==='pay-form'){e.preventDefault();const d=new FormData(e.target);const i=db.invoices.find(x=>x.id===e.target.dataset.id);if(!i)return;(i.payments=i.payments||[]).push({date:d.get('date')||today(),amount:num(d.get('amount')),mode:d.get('mode')||'Cash',ref:String(d.get('ref')||'').trim()});syncPaid(i);save();render();showDetail(i.id);toast(i.paid?'Payment saved — bill fully paid.':`Payment saved. Balance ${money(balance(i))}.`);return}
      if(e.target.id==='rename-list-form'){e.preventDefault();const name=String(new FormData(e.target).get('name')||'').trim();if(name)renameList(e.target.dataset.id,name);closeModal();return}
      if(e.target.id==='item-form'){e.preventDefault();const d=new FormData(e.target);db.catalog.push({id:uid(),partNumber:String(d.get('partNumber')||'').trim(),name:String(d.get('name')).trim(),brand:'',unit:'',kind:d.get('kind'),rate:num(d.get('rate')),taxRate:num(d.get('taxRate')),details:[]});save();render();toast('Item saved. It will show first when you search on a bill.');return}
      if(e.target.id==='settings-form'){e.preventDefault();const d=new FormData(e.target);db.settings={...db.settings,businessName:String(d.get('businessName')).trim(),tagline:String(d.get('tagline')).trim(),phone:String(d.get('phone')).trim(),email:String(d.get('email')).trim(),address:String(d.get('address')).trim(),taxId:String(d.get('taxId')).trim().toUpperCase(),taxRate:num(d.get('taxRate')),terms:String(d.get('terms')||'').trim(),upiId:String(d.get('upiId')||'').trim(),mrpInclusive:d.get('mrpInclusive')==='on',roundOff:d.get('roundOff')==='on'};save();render();toast('Business details saved.')}
    });
    document.getElementById('restore-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.settings||!Array.isArray(d.invoices)||!Array.isArray(d.catalog))throw new Error('Invalid backup');db=norm(d);save();render();toast('Backup restored.')}catch{toast('Could not read that backup file.')}e.target.value=''});
    // Used by js/cloud.js to swap in the shop's data after sign-in and apply changes from other devices.
    window.FF={get db(){return db},toast,
      replaceDb(d){db=norm(d);stockCache=null;persist();rerender()},
      useStore(key,d){storeKey=key;db=norm(d);stockCache=null;persist();render();backupStatus()},
      localDb(){return load(KEY)},
      emptyDb(){return {...structuredClone(defaults),catalog:[]}},
      setRole(r){role=r;document.body.classList.toggle('role-staff',r==='staff');render();backupStatus()},
      clearLocal(){try{localStorage.removeItem(KEY)}catch{}},
      usePriceList(key){plKey=key;priceList={status:'loading',lists:[]};if(page==='items')render();return loadPriceList()},
      plNorm,plPending,plUpdate,
      idbGet(k){return idbDo('readonly',s=>s.get(k))},
      idbPut(k,v){return idbDo('readwrite',s=>s.put(v,k))},
      idbDel(k){return idbDo('readwrite',s=>s.delete(k))}};
    render();backupStatus();
    // With cloud on, wait for sign-in so one shop's uploaded list is never shown to another.
    if(!window.Cloud?.enabled)loadPriceList();
    if(window.Cloud?.enabled)window.Cloud.start(window.FF);
    if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  })();
  </script>
</body>
</html>
