      body{background:white}.sidebar,.main,#modal-root,.toast{display:none!important}#print-area{display:block!important;color:#1a2620;font:11px/1.45 Arial,sans-serif}
      .print-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #244a36;padding-bottom:12px}.print-brand{font-size:20px;font-weight:700}.print-title{text-align:right}.print-title strong{font-size:18px;letter-spacing:2px}
      .print-meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:16px 0}.print-box-title{font-size:9px;color:#6b776f;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
      .print-items{width:100%;border-collapse:collapse;white-space:normal}.print-items th{background:#eef3ef!important;color:#2f4238!important;padding:6px!important;border:1px solid #cfdad2;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-items td{padding:6px!important;border:1px solid #dbe3dd;font-size:11px}.print-items .r{text-align:right}
      .print-bottom{display:flex;justify-content:space-between;gap:30px;margin-top:16px}.print-notes{max-width:55%;color:#3c4b42}.print-totals{width:250px}.print-total{display:flex;justify-content:space-between;padding:3px 0}.print-total.grand{font-size:15px;font-weight:700;border-top:1px solid #b9c8bd;margin-top:4px;padding-top:7px}
      .print-sign{margin-top:50px;text-align:right}.print-gst{width:100%;border-collapse:collapse;margin-top:12px;white-space:normal}.print-gst th,.print-gst td{border:1px solid #dbe3dd;padding:4px 6px!important;font-size:10px;text-align:right}.print-gst th:first-child,.print-gst td:first-child{text-align:left}.print-qr{display:flex;gap:10px;align-items:center;margin-top:12px}.print-qr img,.print-qr canvas{width:90px!important;height:90px!important}.print-total.due{font-weight:700}.print-footer{border-top:1px solid #e0e6e1;margin-top:28px;padding-top:10px;color:#6b776f;text-align:center;font-size:9px}
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">ForgeFlow</div><div class="brand-sub">Workshop billing</div></div></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="main-nav">
      <button class="active" data-page="overview" title="Home"><span class="nav-icon">◫</span><span class="nav-text">Home</span></button>
      <button data-page="invoices" title="Bills"><span class="nav-icon">▤</span><span class="nav-text">Bills</span></button>
      <button data-page="items" title="Price list"><span class="nav-icon">⚙</span><span class="nav-text">Price list &amp; parts</span></button>
      <button data-page="stock" title="Stock"><span class="nav-icon">▦</span><span class="nav-text">Stock</span><span class="nav-badge" id="low-badge"></span></button>
      <button data-page="purchases" title="Purchases"><span class="nav-icon">⇩</span><span class="nav-text">Purchases</span></button>
      <button data-page="expenses" title="Expenses"><span class="nav-icon">₹</span><span class="nav-text">Expenses</span></button>
      <button data-page="customers" title="Customers"><span class="nav-icon">♙</span><span class="nav-text">Customers</span></button>
      <button data-page="reports" title="Reports"><span class="nav-icon">◔</span><span class="nav-text">Reports</span></button>
      <button data-page="settings" title="Settings"><span class="nav-icon">⌘</span><span class="nav-text">Business settings</span></button>
    </nav>
    <div class="sidebar-foot"><div id="pl-status"><span class="local-dot wait"></span>Loading price list…</div><div style="margin-top:6px" id="local-note"><span class="local-dot"></span>Bills are saved on this device.</div><div id="cloud-status"></div><div id="backup-status"></div><div style="margin-top:8px;opacity:.8"><kbd>N</kbd> new bill · <kbd>/</kbd> search</div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="eyebrow" id="top-eyebrow">HOME</div><div class="top-title" id="top-business">Your workshop</div></div><div class="top-actions"><button class="btn primary" data-action="new-invoice">＋ New bill</button><div class="avatar" id="avatar">YW</div></div></header>
    <div class="content" id="view-root"></div>
  </main>
  <div id="modal-root"></div>
  <section id="print-area" style="display:none"></section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="js/cloud.js"></script>
  <input id="restore-file" type="file" accept="application/json" hidden>
  <input id="pricelist-file" type="file" accept=".xlsx,.csv" hidden>
  <script>
  (()=>{
    const KEY='forgeflow_billing_v1';
    const defaults={settings:{businessName:'Your workshop',tagline:'Machine parts & service',phone:'',email:'',address:'',taxId:'',taxName:'GST',taxRate:18,currency:'INR',mrpInclusive:true,roundOff:true,terms:'',upiId:'',lastBackup:''},catalog:[
      {id:'c3',kind:'Service',partNumber:'',name:'Workshop labour',brand:'',unit:'hour',details:[],rate:0,taxRate:18},
      {id:'c4',kind:'Service',partNumber:'',name:'Machine inspection',brand:'',unit:'',details:[],rate:0,taxRate:18}
    ],invoices:[],stock:[],purchases:[],expenses:[]};
    let storeKey=KEY;let role='local';
    let db=load();let page='overview';let searchText='';let catalogSearch='';let catalogList='';let lookupText='';let invoiceFilter='all';let toastTimer;
    // MRP price lists are large, so they live in memory (and IndexedDB when uploaded), never in localStorage.
    // A shop can keep several lists (one per company or brand); searches look through all of them.
    let priceList={status:'loading',lists:[]};
    let plRec={lists:[],removed:[]};let uploadTarget=null;
    // Where the uploaded lists are kept. With cloud on, js/cloud.js points this at the signed-in shop's own key.
    let plKey='pricelist';

    function norm(d){return d&&d.settings?{...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings},catalog:d.catalog||[],invoices:d.invoices||[],stock:d.stock||[],purchases:d.purchases||[],expenses:d.expenses||[]}:structuredClone(defaults)}
    function load(key=KEY){try{return norm(JSON.parse(localStorage.getItem(key)))}catch{return structuredClone(defaults)}}
    function persist(){try{localStorage.setItem(storeKey,JSON.stringify(db))}catch{toast('Could not save — this browser’s storage is full. Download a backup.')}}
    function save(){stockCache=null;persist();updateBrand();backupStatus();window.Cloud?.changed()}
    function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function money(n){const code=db.settings.currency||'INR';try{return new Intl.NumberFormat(code==='INR'?'en-IN':undefined,{style:'currency',currency:code,maximumFractionDigits:2}).format(Number(n)||0)}catch{return code+' '+(Number(n)||0).toFixed(2)}}
    function dateFmt(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return Number.isNaN(+d)?s:d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
    function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
    function num(v){return Math.max(0,Number(v)||0)}

    // ---- Money maths. MRP in India already includes GST, so "inclusive" bills back the tax out of the price.
    function lineCalc(x,inclusive){const gross=num(x.qty)*num(x.rate)*(1-Math.min(100,num(x.disc))/100);const g=num(x.taxRate);const taxable=inclusive?gross/(1+g/100):gross;const tax=inclusive?gross-taxable:gross*g/100;return{taxable,tax,amount:taxable+tax}}
    function totals(inv){let subtotal=0,tax=0;(inv.items||[]).forEach(x=>{const c=lineCalc(x,inv.inclusive);subtotal+=c.taxable;tax+=c.tax});const exact=subtotal+tax;const total=inv.roundOff?Math.round(exact):exact;return{subtotal,tax,roundOff:total-exact,total}}
    function taxLines(inv,t){const name=db.settings.taxName||'Tax';if(inv.gstType==='inter')return [['IGST',t.tax]];if(inv.gstType==='intra')return [['CGST',t.tax/2],['SGST',t.tax/2]];return [[name,t.tax]]}
    function words(n){n=Math.round(n);if(!n)return 'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');const parts=[];[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']].forEach(([v,w])=>{if(n>=v){parts.push((v===1e7?words(Math.floor(n/v)):two(Math.floor(n/v)))+' '+w);n%=v}});if(n)parts.push(three(n));return parts.join(' ')}

    function invNumber(type='bill'){const y=new Date().getFullYear();const prefix=(type==='estimate'?'EST-':'INV-')+y+'-';const max=db.invoices.reduce((m,x)=>String(x.number||'').startsWith(prefix)?Math.max(m,parseInt(String(x.number).slice(prefix.length))||0):m,0);return prefix+String(max+1).padStart(3,'0')}
    // ---- Estimates & payments. A bill can be paid in parts; old bills that only have paid:true count as fully paid.
    function isEst(i){return i.type==='estimate'}
    function bills(){return db.invoices.filter(x=>!isEst(x))}
    function received(i){if(isEst(i))return 0;const p=(i.payments||[]).reduce((a,x)=>a+num(x.amount),0);return p||(i.paid?totals(i).total:0)}
    function balance(i){return isEst(i)?0:Math.max(0,totals(i).total-received(i))}
    function syncPaid(i){i.paid=!isEst(i)&&balance(i)<0.005;if(i.paid){i.paidAt=i.paidAt||today()}else delete i.paidAt}
    function collectedIn(month){return bills().reduce((a,i)=>a+((i.payments||[]).length?i.payments.filter(p=>(p.date||'').slice(0,7)===month).reduce((s,p)=>s+num(p.amount),0):(i.paid&&(i.paidAt||i.date||'').slice(0,7)===month?totals(i).total:0)),0)}
    function state(inv){if(isEst(inv))return 'Estimate';if(inv.paid||balance(inv)<0.005)return 'Paid';if(received(inv)>0)return 'Partly paid';return inv.dueDate&&inv.dueDate<today()?'Overdue':'Open'}
    function badge(s){return `<span class="status ${s==='Partly paid'?'partly':s.toLowerCase()}">${s}</span>`}
    function upiLink(i){const s=db.settings;const due=balance(i);if(!s.upiId||isEst(i)||due<0.005)return '';return `upi://pay?pa=${encodeURIComponent(s.upiId)}&pn=${encodeURIComponent(s.businessName||'')}&am=${due.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Bill '+i.number)}`}
    function drawQr(el,text){if(!el||!text||typeof QRCode==='undefined')return;el.innerHTML='';try{new QRCode(el,{text,width:192,height:192,correctLevel:QRCode.CorrectLevel.M})}catch{}}
    function backupStatus(){const el=document.getElementById('backup-status');if(!el)return;if(role==='staff'){el.innerHTML='';return}const last=db.settings.lastBackup;const days=last?Math.floor((new Date(today())-new Date(last))/864e5):Infinity;el.innerHTML=db.invoices.length&&days>7?`<div class="backup-warn" data-action="backup" title="Download a backup file">⚠ ${last?'Last backup '+days+' days ago':'No backup yet'} — back up now</div>`:''}
    function updateBrand(){const s=db.settings;document.title=(s.businessName||'Your workshop')+' — ForgeFlow';document.getElementById('top-business').textContent=s.businessName||'Your workshop';document.getElementById('avatar').textContent=(s.businessName||'YW').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3000)}

    // ---- Price list loading & search
    function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('forgeflow',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const q=fn(d.transaction('kv',mode).objectStore('kv'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
    // Stored as {lists:[{id,name,rows,version?,pending?}],removed:[ids]}. Older versions kept one {name,rows} list.
    // `pending` (cloud only): true = upload this list, 'rename' = send its new name, 'claim' = see js/cloud.js.
    function plNorm(r){if(!r)return{lists:[],removed:[]};if(Array.isArray(r.lists))return{lists:r.lists.filter(l=>l?.rows?.length),removed:r.removed||[]};if(r.pending==='clear')return{lists:[],removed:['main']};return{lists:r.rows?.length?[{id:'main',name:r.name||'Price list',rows:r.rows,version:r.version,pending:r.pending,importedAt:r.importedAt}]:[],removed:[]}}
    function plPending(r){r=plNorm(r);return r.removed.length>0||r.lists.some(l=>l.pending)}
    // Read, change and write the stored lists in one transaction, so the page and cloud sync never overwrite each other.
    function plUpdate(k,fn){return idb().then(d=>new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite'),s=tx.objectStore('kv');let out;const q=s.get(k);q.onsuccess=()=>{out=fn(plNorm(q.result));s.put(out,k)};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
    function setPriceLists(rec){plRec=rec;priceList={status:rec.lists.length?'ready':'none',lists:rec.lists.map(l=>({id:l.id,name:l.name,pending:l.pending,rows:l.rows.map(r=>{const pn=String(r[0]??'').trim(),desc=String(r[1]??'').trim();return{pn,desc,mrp:num(r[2]),gst:r[3]===null||r[3]===undefined||r[3]===''?null:num(r[3]),hay:(pn+' '+desc).toLowerCase(),pnn:normPn(pn),list:l.name}})}))};if(catalogList&&catalogList!=='mine'&&!priceList.lists.some(l=>l.id===catalogList))catalogList=''}
    function plParts(){return priceList.lists.reduce((a,l)=>a+l.rows.length,0)}
    async function loadPriceList(){
      // No list is bundled with the app: each shop uploads its own.
      let rec;try{rec=plNorm(await idbDo('readonly',s=>s.get(plKey)))}catch{rec=plNorm(null)}
      setPriceLists(rec);afterPriceList()}
    function afterPriceList(){const el=document.getElementById('pl-status');const n=priceList.lists.length;el.innerHTML=priceList.status==='ready'?`<span class="local-dot"></span>${n===1?esc(priceList.lists[0].name):n+' price lists'} · ${plParts().toLocaleString('en-IN')} parts`:priceList.status==='loading'?'<span class="local-dot wait"></span>Loading price list…':'<span class="local-dot wait"></span>No price list uploaded';if(page==='items')render();refreshLookup()}
    function normPn(s){return String(s).toLowerCase().replace(/[\s\/\-.]/g,'')}
    function mine(){return db.catalog.map(c=>({src:'mine',id:c.id,pn:c.partNumber||'',desc:c.name,mrp:num(c.rate),gst:num(c.taxRate),kind:c.kind||'Part',unit:c.unit||'',hay:((c.partNumber||'')+' '+c.name+' '+(c.brand||'')).toLowerCase(),pnn:normPn(c.partNumber||'')}))}
    // Ranks: exact part number, part number starts with, description starts with, anything containing every word.
    // `only`: '' = your items and every list, 'mine' = just your items, or one list's id.
    function searchParts(q,limit=8,only=''){q=q.trim().toLowerCase();if(!q)return{items:[],total:0};const words=q.split(/\s+/).map(w=>[w,normPn(w)]),qn=normPn(q);const buckets=[[],[],[],[]];const test=r=>{for(const [w,wn] of words){if(!r.hay.includes(w)&&!(wn&&r.pnn.includes(wn)))return -1}if(qn&&r.pnn===qn)return 0;if(qn&&r.pnn.startsWith(qn))return 1;if(r.hay.startsWith(q,r.pn.length+1))return 2;return 3};const lists=only==='mine'?[mine()]:only?priceList.lists.filter(l=>l.id===only).map(l=>l.rows):[mine(),...priceList.lists.map(l=>l.rows)];for(const list of lists){for(const r of list){const s=test(r);if(s>=0)buckets[s].push(r)}}const all=buckets.flat();return{items:all.slice(0,limit),total:all.length}}
    function gstOf(r){return r.gst===null?num(db.settings.taxRate):r.gst}
    function srcTag(r){return r.src==='mine'?'<span class="tag saved">MY ITEM</span>':priceList.lists.length>1&&r.list?`<span class="tag">${esc(r.list)}</span>`:''}

    function pageTitle(){return {overview:['Home','Check a price or start a bill'],invoices:['Bills','Create, find and follow up on customer bills'],customers:['Customers','Your customer list, built from your bills'],items:['Price list & parts','Search the MRP list and keep your own labour and parts'],settings:['Business settings','Details that appear on every bill'],stock:['Stock','Goes down with every bill and up with every purchase'],purchases:['Purchases','Parts bought from suppliers'],expenses:['Expenses','Rent, salary, electricity and other shop costs'],reports:['Reports','Sales, GST, collections and profit for any period']}[page]}
    function render(){if(!canPage(page))page='overview';updateBrand();document.querySelectorAll('#main-nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.classList.toggle('hidden',!canPage(b.dataset.page))});const lowN=stockRows().filter(r=>r.low).length;document.getElementById('low-badge').textContent=lowN||'';const [title,sub]=pageTitle();document.getElementById('top-eyebrow').textContent=title.toUpperCase();document.getElementById('view-root').innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${page==='overview'?'<button class="btn primary big" data-action="new-invoice">＋ Create a bill</button>':''}</div>${({overview:()=>lowBanner()+overview(),invoices:invoicesView,customers:customersView,items:itemsView,stock:stockView,purchases:purchasesView,expenses:expensesView,reports:reportsView,settings:settingsView})[page]()}`;if(page==='overview')refreshLookup();if(page==='items')refreshCatalog();if(page==='settings')window.Cloud?.renderTeam()}

    function resultRow(r){return `<div class="result-row"><span class="pn">${esc(r.pn||'—')}</span><span class="desc">${esc(r.desc)} ${srcTag(r)}</span><span class="gst muted" style="font-size:12px">GST ${gstOf(r)}%</span><span class="mrp">${money(r.mrp)}</span><button class="btn small soft" data-bill-part='${esc(JSON.stringify(partToLine(r)))}'>＋ Bill</button></div>`}
    function refreshLookup(){const box=document.getElementById('lookup-results');if(!box)return;if(!lookupText.trim()){box.innerHTML='';return}if(priceList.status==='loading'){box.innerHTML='<div class="result-more">Price list is still loading…</div>';return}const {items,total}=searchParts(lookupText,8);box.innerHTML=items.length?items.map(resultRow).join('')+(total>items.length?`<div class="result-more">Showing 8 of ${total.toLocaleString('en-IN')} matches — type more of the part number or name to narrow down.</div>`:''):'<div class="result-more">No part found. Check the part number, or add it as your own item under Price list &amp; parts.</div>'}

    function overview(){const list=[...db.invoices].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const month=today().slice(0,7);const unpaid=bills().filter(x=>balance(x)>=0.005);const paid=collectedIn(month);const outstanding=unpaid.reduce((a,x)=>a+balance(x),0);const estCount=db.invoices.length-bills().length;const customers=new Set(db.invoices.map(x=>(x.customerName||'').trim().toLowerCase()).filter(Boolean)).size;
      return `<section class="card lookup"><div class="card-title">Check a part price</div><div class="card-note">Type a part number or name — e.g. <b>335/G1419</b> or <b>seal kit</b></div><div class="big-search"><input id="lookup" placeholder="Part number or description…" value="${esc(lookupText)}" autocomplete="off"></div><div class="lookup-results" id="lookup-results"></div></section>
        <div class="metrics"><div class="metric"><div class="metric-label">To be collected</div><div class="metric-value">${money(outstanding)}</div><div class="metric-note">${unpaid.length} unpaid bill${unpaid.length===1?'':'s'}</div></div><div class="metric"><div class="metric-label">Collected this month</div><div class="metric-value">${money(paid)}</div><div class="metric-note">Payments received this month</div></div><div class="metric"><div class="metric-label">Bills made</div><div class="metric-value">${bills().length}</div><div class="metric-note">${estCount?estCount+' estimate'+(estCount===1?'':'s')+' too':'On this device'}</div></div><div class="metric"><div class="metric-label">Customers</div><div class="metric-value">${customers}</div><div class="metric-note">From your bills</div></div></div>
        <div class="grid-two"><section class="card list-card" style="margin-top:0"><div class="card-head"><div><div class="card-title">Recent bills</div><div class="card-note">Click a bill to view, print or mark paid</div></div><button class="btn small" data-page-link="invoices">All bills →</button></div>${list.length?invoiceTable(list.slice(0,6),false):emptyBlock('No bills yet','Click “Create a bill”, type part numbers, and the MRP and GST fill in automatically.','Create your first bill')}</section>
        <section class="card"><div class="card-head"><div><div class="card-title">Billing — last 6 months</div></div></div>${chart()}<div class="chart-legend"><span><i class="legend-dot"></i>Unpaid</span><span><i class="legend-dot paid"></i>Paid</span></div><hr class="divider"><div class="quick-actions"><a class="quick-action" href="#" data-page-link="items"><span class="quick-icon">⚙</span><span><b>Price list &amp; labour charges</b><small>Upload a new MRP list, add labour rates</small></span></a><a class="quick-action" href="#" data-page-link="settings"><span class="quick-icon">⌘</span><span><b>Business details</b><small>Name, GSTIN and address for your bills</small></span></a></div></section></div>`}
    function chart(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('en-IN',{month:'short'})})}const vals=months.map(m=>{const xs=bills().filter(i=>i.date?.slice(0,7)===m.key);return{label:m.label,open:xs.reduce((a,x)=>a+balance(x),0),paid:xs.reduce((a,x)=>a+Math.min(received(x),totals(x).total),0)}});const max=Math.max(1,...vals.map(x=>x.open+x.paid));return `<div class="chart">${vals.map(v=>`<div class="chart-col"><div class="bar-wrap" title="${esc(v.label)} · ${money(v.open+v.paid)}"><div class="bar" style="height:${Math.max(2,v.open/max*100)}%"></div><div class="bar paid" style="height:${Math.max(2,v.paid/max*100)}%"></div></div><span class="chart-label">${esc(v.label)}</span></div>`).join('')}</div>`}
    function invoiceTable(list,showActions=true){return `<div class="table-wrap"><table><thead><tr><th>BILL NO.</th><th>CUSTOMER</th><th>DATE</th><th>STATUS</th><th class="right">AMOUNT</th>${showActions?'<th></th>':''}</tr></thead><tbody>${list.map(i=>`<tr data-open="${esc(i.id)}"><td><span class="invoice-no">${esc(i.number)}</span></td><td><b>${esc(i.customerName||'Unnamed customer')}</b><div class="subcell">${esc(i.machineRef||'')}</div></td><td>${dateFmt(i.date)}</td><td>${badge(state(i))}</td><td class="num"><b>${money(totals(i).total)}</b>${state(i)==='Partly paid'?`<div class="subcell">Due ${money(balance(i))}</div>`:''}</td>${showActions?'<td class="right"><button class="btn small" data-open-btn="'+esc(i.id)+'">View</button></td>':''}</tr>`).join('')}</tbody></table></div>`}
    function emptyBlock(title,text,button){return `<div class="empty"><div class="empty-icon">▤</div><h3>${title}</h3><p>${text}</p><button class="btn primary" data-action="new-invoice">＋ ${button}</button></div>`}
    function invoicesView(){let list=[...db.invoices].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.number||'').localeCompare(a.number||''));if(searchText){const q=searchText.toLowerCase();list=list.filter(i=>[i.number,i.customerName,i.customerPhone,i.machineRef,...(i.items||[]).map(x=>x.partNumber)].some(x=>(x||'').toLowerCase().includes(q)))}if(invoiceFilter==='unpaid')list=list.filter(i=>balance(i)>=0.005);else if(invoiceFilter!=='all')list=list.filter(i=>state(i).toLowerCase()===invoiceFilter);return `<div class="toolbar"><div class="search"><input id="invoice-search" class="field" placeholder="Search bill no., customer, phone, machine or part…" value="${esc(searchText)}"></div><select id="invoice-filter" class="field" style="width:auto;min-width:140px"><option value="all">All bills</option><option value="unpaid">Money due</option><option value="overdue">Overdue</option><option value="partly paid">Partly paid</option><option value="paid">Paid</option><option value="estimate">Estimates</option></select><span style="flex:1"></span><button class="btn" data-action="export-csv">↓ Export to Excel (CSV)</button><button class="btn" data-action="new-estimate">＋ New estimate</button><button class="btn primary" data-action="new-invoice">＋ New bill</button></div><section class="card list-card" style="margin-top:0">${list.length?invoiceTable(list,true):db.invoices.length?`<div class="empty"><div class="empty-icon">⌕</div><h3>No matching bills</h3><p>Try another search or filter.</p></div>`:emptyBlock('Your bills will show here','Create a bill for parts, labour or both, then print it or send it on WhatsApp.','Create a bill')}</section>`}
    function customerRows(){const map=new Map();db.invoices.forEach(i=>{const key=(i.customerName||'Unnamed customer').trim().toLowerCase();let c=map.get(key);if(!c){c={name:i.customerName||'Unnamed customer',phone:'',email:'',address:'',gstin:'',count:0,billed:0,open:0,last:''};map.set(key,c)}c.count++;if(!isEst(i))c.billed+=totals(i).total;c.open+=balance(i);if((i.date||'')>=c.last){c.last=i.date||'';c.phone=i.customerPhone||c.phone;c.email=i.customerEmail||c.email;c.address=i.customerAddress||c.address;c.gstin=i.customerGstin||c.gstin}});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
    function customersView(){const cs=customerRows().filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(searchText.toLowerCase()));return `<div class="toolbar"><div class="search"><input id="customer-search" class="field" placeholder="Search customers…" value="${esc(searchText)}"></div><span class="muted" style="font-size:12px">${cs.length} customer${cs.length===1?'':'s'}</span></div><section class="card list-card" style="margin-top:0">${db.invoices.length?`<div class="table-wrap"><table><thead><tr><th>CUSTOMER</th><th>CONTACT</th><th>BILLS</th><th>LAST BILL</th><th class="right">TOTAL BILLED</th><th class="right">UNPAID</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td><div class="customer-name-wrap"><span class="customer-avatar">${esc(c.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><b>${esc(c.name)}</b></div></td><td>${esc(c.phone||c.email||'—')}</td><td>${c.count}</td><td>${dateFmt(c.last)}</td><td class="num">${money(c.billed)}</td><td class="num"><b>${money(c.open)}</b></td><td class="right"><button class="btn small soft" data-bill-customer="${esc(c.name)}">＋ New bill</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">♙</div><h3>Customers appear after your first bill</h3><p>Next time you type their name on a bill, phone and address fill in automatically.</p><button class="btn primary" data-action="new-invoice">＋ Create a bill</button></div>`}</section>`}

    function itemsView(){const pl=priceList;const owner=isOwner();const cloud=!!window.Cloud?.enabled;
      const listRows=pl.lists.map(l=>`<div class="pl-row"><span class="pl-badge">₹</span><div class="pl-row-main"><div class="card-title">${esc(l.name)}</div><div class="card-note">${l.rows.length.toLocaleString('en-IN')} parts${cloud&&l.pending&&l.pending!=='claim'?' · saving to your shop…':''}</div></div>${owner?`<div class="pl-row-actions"><button class="btn small" data-upload-list="${esc(l.id)}" title="Upload a newer file for this list">↑ Replace</button><button class="btn small" data-rename-list="${esc(l.id)}">Rename</button><button class="btn small danger" data-remove-list="${esc(l.id)}">Remove</button></div>`:''}</div>`).join('');
      const plCard=`<section class="card"><div class="card-head" style="margin-bottom:0"><div><div class="card-title">MRP price lists</div><div class="card-note">${pl.status==='ready'?`${pl.lists.length} list${pl.lists.length===1?'':'s'} · ${plParts().toLocaleString('en-IN')} parts · ${cloud?'your shop’s own lists':'uploaded on this device'}`:pl.status==='loading'?'Loading price lists…':owner?'Upload your MRP Excel file to search parts by number.':'Ask the owner to upload the MRP list.'}</div></div></div>${listRows?`<div class="pl-list">${listRows}</div>`:''}${owner?`<div class="setting-actions"><button class="btn primary" data-action="upload-pricelist">＋ ${pl.lists.length?'Add another price list':'Upload MRP list'}</button></div><div class="hint-box">Keep one list per company or brand — searches and bills look through all of them. When a company sends a new MRP Excel file, click <b>Replace</b> on its list (uploading a file with the same name as a list also replaces it). Files need columns like <b>Material</b> (part no.), <b>Desc</b>, <b>MRP</b> and <b>GST rate</b>. ${cloud?'Lists are saved to your shop only: your staff get them on every device, and other shops can never see them.':'The files stay on this device.'} Old bills keep their prices.</div>`:''}</section>`;
      const mineList=db.catalog.length?`<div class="table-wrap" style="margin-top:12px"><table><tbody>${db.catalog.map(c=>`<tr><td class="wrap"><b>${esc(c.name)}</b><div class="subcell">${esc([c.partNumber,c.kind,c.unit].filter(Boolean).join(' · '))}</div></td><td class="num">${money(c.rate)}</td><td class="right"><button class="btn small danger" data-delete-item="${esc(c.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'';
      const form=`<section class="card" style="margin-top:16px"><div class="card-title">Your labour charges &amp; extra parts</div><div class="card-note">For things not in the MRP list — labour, inspection, local parts. They show up first when you search.</div>${mineList}<form id="item-form" style="margin-top:16px"><div class="form-grid"><div class="wide"><label>Name *</label><input name="name" class="field" required placeholder="e.g. Engine overhaul labour"></div><div><label>Type</label><select name="kind" class="field"><option>Service</option><option>Part</option></select></div><div><label>Part no. (optional)</label><input name="partNumber" class="field" placeholder="—"></div><div><label>Price (${esc(db.settings.currency)})</label><input name="rate" class="field" type="number" min="0" step="0.01" value="0"></div><div><label>${esc(db.settings.taxName)} %</label><input name="taxRate" class="field" type="number" min="0" step="0.01" value="${num(db.settings.taxRate)}"></div></div><button class="btn primary" style="margin-top:14px">＋ Save item</button></form></section>`;
      return `<div class="grid-two"><div><div class="toolbar"><div class="search" style="max-width:none"><input id="catalog-search" class="field" style="font-size:15px;padding-top:12px;padding-bottom:12px" placeholder="Search part number or description…" value="${esc(catalogSearch)}" autocomplete="off"></div>${pl.lists.length>1?`<select id="catalog-list" class="field" style="width:auto;min-width:150px" aria-label="Which list to search"><option value="">All lists</option>${pl.lists.map(l=>`<option value="${esc(l.id)}" ${catalogList===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}<option value="mine" ${catalogList==='mine'?'selected':''}>My items only</option></select>`:''}</div><section class="card list-card" style="margin-top:0" id="catalog-results"></section></div><div>${plCard}${form}</div></div>`}
    function refreshCatalog(){const box=document.getElementById('catalog-results');if(!box)return;const q=catalogSearch.trim();if(!q){box.innerHTML=`<div class="empty"><div class="empty-icon">⌕</div><h3>Search ${plParts()?plParts().toLocaleString('en-IN')+' parts':'the price list'}${priceList.lists.length>1?' in '+priceList.lists.length+' lists':''}</h3><p>Type a part number like <b>1096231630</b> or words like <b>oil seal</b>. Click “＋ Bill” to start a bill with that part.</p></div>`;return}const {items,total}=searchParts(q,100,catalogList);box.innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>PART NO.</th><th>DESCRIPTION</th><th class="right">MRP</th><th class="right">GST</th><th></th></tr></thead><tbody>${items.map(r=>`<tr><td><b>${esc(r.pn||'—')}</b></td><td class="wrap">${esc(r.desc)} ${srcTag(r)}</td><td class="num"><b>${money(r.mrp)}</b></td><td class="num">${gstOf(r)}%</td><td class="right"><button class="btn small soft" data-bill-part='${esc(JSON.stringify(partToLine(r)))}'>＋ Bill</button></td></tr>`).join('')}</tbody></table></div><div class="result-more">${total>items.length?`Showing first 100 of ${total.toLocaleString('en-IN')} matches. Type more to narrow down.`:`${total} match${total===1?'':'es'}`}</div>`:'<div class="empty"><div class="empty-icon">⌕</div><h3>No matching parts</h3><p>Check the part number, or save it on the right as your own item.</p></div>'}

    function settingsView(){const s=db.settings;return `<section class="card setting-card"><div class="card-title">Business details</div><div class="card-note">Printed at the top of every bill.</div><form id="settings-form"><div class="form-grid" style="margin-top:16px"><div><label>Business name</label><input class="field" name="businessName" value="${esc(s.businessName)}" required></div><div><label>Short description</label><input class="field" name="tagline" value="${esc(s.tagline)}" placeholder="Machine parts & service"></div><div><label>Phone</label><input class="field" name="phone" value="${esc(s.phone)}"></div><div><label>Email</label><input class="field" name="email" type="email" value="${esc(s.email)}"></div><div class="wide"><label>Business address</label><textarea class="field" name="address" rows="2">${esc(s.address)}</textarea></div><div><label>Your GSTIN</label><input class="field" name="taxId" value="${esc(s.taxId)}" placeholder="e.g. 09ABCDE1234F1Z5"></div><div><label>UPI ID (for pay QR on bills)</label><input class="field" name="upiId" value="${esc(s.upiId)}" placeholder="e.g. workshop@okbank"></div><div><label>Default GST rate for new items (%)</label><input class="field" name="taxRate" type="number" min="0" step="0.01" value="${num(s.taxRate)}"></div><div class="wide"><label>Bank / UPI details and terms (printed on every bill)</label><textarea class="field" name="terms" rows="2" placeholder="e.g. UPI: workshop@okbank · Goods once sold will not be taken back">${esc(s.terms)}</textarea></div><div class="wide"><label class="check"><input type="checkbox" name="mrpInclusive" ${s.mrpInclusive?'checked':''}><span><b>MRP already includes GST</b> (normal in India). The bill total equals MRP × qty and GST is shown inside it. Untick if your prices are before GST.</span></label></div><div class="wide"><label class="check"><input type="checkbox" name="roundOff" ${s.roundOff?'checked':''}><span><b>Round bill total</b> to the nearest rupee</span></label></div></div><button class="btn primary" style="margin-top:15px">Save business details</button></form></section>${role!=='local'?'<section class="card setting-card" id="team-card"></section>':''}<section class="card setting-card"><div class="card-title">Your data</div><div class="card-note">${role!=='local'?'Everything is saved in the cloud and on this device, and syncs to every phone or computer you sign in on. A backup file is still a good idea once a month.':'Bills and settings stay in this browser on this device. Download a backup regularly, and before changing computer or clearing browser data.'}</div><div class="setting-actions"><button class="btn" data-action="backup">↓ Download backup</button><button class="btn" data-action="restore">↑ Restore backup</button><button class="btn danger" data-action="clear-data">Clear all bills &amp; settings</button></div></section>`}

    function openModal(html,cls=''){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-layer"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;root.querySelector('.modal-layer').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal()})}
    function closeModal(){document.getElementById('modal-root').innerHTML=''}

    // ---- Bill builder
    function partToLine(r){return{kind:r.kind||'Part',partNumber:r.pn,description:r.desc,qty:1,rate:r.mrp,disc:0,taxRate:gstOf(r)}}
    function showBuilder(id=null,prefill={}){const old=id?db.invoices.find(x=>x.id===id):null;const s=db.settings;const type=old?(old.type||'bill'):(prefill.type||'bill');const inv=old||{type,number:invNumber(type),machineRef:prefill.machineRef||'',notes:prefill.notes||'',date:today(),dueDate:'',inclusive:s.mrpInclusive,roundOff:s.roundOff,gstType:'intra',items:prefill.items||[],customerName:prefill.customer?.name||'',customerPhone:prefill.customer?.phone||'',customerEmail:prefill.customer?.email||'',customerAddress:prefill.customer?.address||'',customerGstin:prefill.customer?.gstin||''};const names=customerRows().map(c=>`<option value="${esc(c.name)}"></option>`).join('');
      openModal(`<div class="modal-head"><div><h2 id="builder-title">${builderTitle(!!old,type,inv.number)}</h2><p>Type part numbers — MRP and GST fill in by themselves</p></div><button class="close" data-close aria-label="Close">×</button></div><form id="invoice-form" data-id="${old?esc(old.id):''}" autocomplete="off"><div class="modal-body">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div class="step" style="margin:0"><span class="step-no">1</span>Customer</div><div class="seg" role="radiogroup" aria-label="Document type"><label><input type="radio" name="docType" value="bill" ${type==='bill'?'checked':''}><span>Bill</span></label><label><input type="radio" name="docType" value="estimate" ${type==='estimate'?'checked':''}><span>Estimate / quotation</span></label></div></div>
        <div class="form-grid three"><div><label>Customer name *</label><input class="field" name="customerName" list="customer-names" required value="${esc(inv.customerName||'')}" placeholder="Start typing — past customers appear"><datalist id="customer-names">${names}</datalist></div><div><label>Phone</label><input class="field" name="customerPhone" value="${esc(inv.customerPhone||'')}" inputmode="tel"></div><div><label>Machine / vehicle no.</label><input class="field" name="machineRef" value="${esc(inv.machineRef||'')}" placeholder="Model, serial or reg. no."></div>
        <details class="wide" ${inv.customerAddress||inv.customerGstin||inv.customerEmail||old?'open':''}><summary class="muted" style="cursor:pointer;font-size:13px">More customer details (address, GSTIN, email, dates)</summary><div class="form-grid three" style="margin-top:12px"><div><label>Customer GSTIN</label><input class="field" name="customerGstin" value="${esc(inv.customerGstin||'')}" placeholder="For business customers"></div><div><label>Email</label><input class="field" name="customerEmail" type="email" value="${esc(inv.customerEmail||'')}"></div><div><label>Address</label><input class="field" name="customerAddress" value="${esc(inv.customerAddress||'')}"></div><div><label>Bill date</label><input class="field" type="date" name="date" value="${esc(inv.date)}"></div><div><label>Pay by (optional)</label><input class="field" type="date" name="dueDate" value="${esc(inv.dueDate||'')}"></div><div><label>GST type</label><select class="field" name="gstType"><option value="intra" ${inv.gstType==='intra'?'selected':''}>Same state (CGST + SGST)</option><option value="inter" ${inv.gstType==='inter'?'selected':''}>Other state (IGST)</option>${inv.gstType?'':'<option value="" selected>Single tax line</option>'}</select></div></div></details></div>
        <hr class="divider"><div class="step"><span class="step-no">2</span>Parts &amp; labour</div>
        <div class="add-box"><div class="add-row"><div class="pick-wrap"><input id="add-part" class="field" placeholder="Type part number or name, then press Enter…" aria-label="Add a part"><div class="suggest" id="add-suggest"></div></div><button type="button" class="btn" data-add-labour>＋ Labour / service</button></div><div class="helper">Use <kbd>↑</kbd> <kbd>↓</kbd> to pick, <kbd>Enter</kbd> to add. Adding the same part again increases its quantity.</div></div>
        <div class="line-header"><span>ITEM</span><span>QTY</span><span>${inv.inclusive?'MRP':'PRICE'} (each)</span><span>DISC %</span><span>GST %</span><span class="right">AMOUNT</span><span></span></div>
        <div id="line-items">${inv.items.map(lineRow).join('')}</div><div class="no-lines" id="no-lines">No items yet — search above to add the first part.</div>
        <div class="bill-bottom"><div><label>Note on bill (optional)</label><textarea class="field" name="notes" rows="3" placeholder="Warranty, work done, payment note…">${esc(inv.notes||'')}</textarea><div style="margin-top:12px;display:grid;gap:8px"><label class="check"><input type="checkbox" name="inclusive" ${inv.inclusive?'checked':''}><span>Prices include GST (MRP)</span></label><label class="check"><input type="checkbox" name="roundOff" ${inv.roundOff?'checked':''}><span>Round total to nearest rupee</span></label></div>${old?'':`<div id="recv-wrap" class="${type==='estimate'?'hidden':''}" style="margin-top:14px"><label>Amount received now (optional)</label><div class="pay-box"><input class="field" type="number" min="0" step="0.01" name="receivedNow" placeholder="0"><button type="button" class="btn small" data-recv-full>Full amount</button></div>${modePicker('payMode')}<div class="helper">Leave empty if the customer pays later. Part payments are fine.</div></div>`}</div><div id="invoice-totals"></div></div>
      </div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit" class="btn" data-after="none">${old?'Save changes':'Save'}</button><button type="submit" class="btn primary" data-after="print">Save &amp; print</button></div></div></form>`,'builder');
      refreshTotals();setTimeout(()=>(old?document.getElementById('add-part'):document.querySelector('#invoice-form [name=customerName]'))?.focus(),30)}
    const PAY_MODES=['Cash','UPI','Online','Bank transfer','Cheque','Card'];
    function modePicker(name,selected='Cash'){return `<div class="seg wrap pay-modes" role="radiogroup" aria-label="Payment method">${PAY_MODES.map(m=>`<label><input type="radio" name="${name}" value="${m}" ${m===selected?'checked':''}><span>${m}</span></label>`).join('')}</div>`}
    function modeLabel(m){return m||'Not recorded'}
    function builderTitle(isOld,type,number){return `${isOld?'Edit':'New'} ${type==='estimate'?'estimate':'bill'} · ${esc(number)}`}
    function lineRow(x={}){const id=x.id||uid();const svc=x.kind==='Service';return `<div class="line-row" data-line="${esc(id)}" data-kind="${esc(x.kind||'Part')}"><div class="line-desc"><input class="field desc-input" placeholder="${svc?'Labour / service description':'Item description'}" value="${esc(x.description||'')}"><div class="line-meta"><span class="tag ${svc?'svc':''}">${svc?'LABOUR':'PART'}</span>${svc?'':`<input class="field pn-input" placeholder="Part no." value="${esc(x.partNumber||'')}">`}</div></div><label class="cell c-q"><span>Qty</span><input class="field qty" type="number" min="0" step="any" value="${esc(x.qty??1)}" aria-label="Quantity"></label><label class="cell c-r"><span>Price each</span><input class="field rate" type="number" min="0" step="0.01" value="${esc(x.rate??0)}" aria-label="Price each"></label><label class="cell c-s"><span>Disc %</span><input class="field disc" type="number" min="0" max="100" step="0.01" value="${esc(x.disc||0)}" aria-label="Discount percent"></label><label class="cell c-g"><span>GST %</span><input class="field tax" type="number" min="0" step="0.01" value="${esc(x.taxRate??num(db.settings.taxRate))}" aria-label="GST percent"></label><div class="line-amount">—</div><button type="button" class="remove" title="Remove line" aria-label="Remove line">×</button></div>`}
    function readLine(r){return{id:r.dataset.line,kind:r.dataset.kind||'Part',description:r.querySelector('.desc-input').value.trim(),partNumber:r.querySelector('.pn-input')?.value.trim()||'',qty:num(r.querySelector('.qty').value),rate:num(r.querySelector('.rate').value),disc:Math.min(100,num(r.querySelector('.disc').value)),taxRate:num(r.querySelector('.tax').value)}}

    function payLines(t,recv,cls='total-line'){return recv>=0.005?`<div class="${cls} recv"><span>Received</span><b>${money(Math.min(recv,t.total))}</b></div><div class="${cls} due"><span>Balance due</span><b>${money(Math.max(0,t.total-recv))}</b></div>`:''}

    async function importPriceList(file,target){const ext=file.name.split('.').pop().toLowerCase();toast('Reading '+file.name+'… this can take a few seconds.');let rows;if(ext==='csv')rows=parseDelimited(await file.text());else if(ext==='xlsx')rows=await readXlsx(file);else throw new Error('Please choose an .xlsx Excel file or a .csv file.');const headerRow=rows.findIndex(r=>r.some(v=>String(v||'').trim()));if(headerRow<0)throw new Error('This spreadsheet is empty.');const headers=rows[headerRow].map(headerKey);const find=aliases=>headers.findIndex(h=>aliases.includes(h));const pCol=find(['material','materialcode','materialno','partnumber','partno','part','sku','itemcode','code','productcode']);const dCol=find(['desc','description','materialdescription','partdescription','itemdescription','name','itemname','partname']);const mCol=find(['mrp','mrprs','price','listprice','unitprice','sellingprice','rate']);const gCol=find(['gstrate','gst','gstpercent','gstper','taxrate','tax','taxpercent']);if(pCol<0||mCol<0)throw new Error('Could not find the part number and MRP columns. The first row should have headings like Material, Desc, MRP and GST rate.');const out=[];for(const r of rows.slice(headerRow+1)){const pn=String(r[pCol]??'').replace(/ /g,' ').trim();if(!pn)continue;const mrp=Number(String(r[mCol]??'').replace(/[^0-9.]/g,''));const g=String(r[gCol]??'').replace(/[^0-9.]/g,'');out.push([pn,String(r[dCol]??'').replace(/\s+/g,' ').trim(),Number.isFinite(mrp)?mrp:0,gCol<0||g===''?null:Number(g)])}if(!out.length)throw new Error('No parts found in that file.');const fileName=file.name.replace(/\.[^.]+$/,'');const cloud=!!window.Cloud?.enabled;
      // Replace the chosen list, or a list with the same name as the file; otherwise add a new list.

    function confirmModal(title,body,action,label='Delete'){openModal(`<div class="modal-head"><div><h2>${title}</h2></div><button class="close" data-close>×</button></div><div class="modal-body"><p style="margin:0;color:var(--muted);font-size:14px">${body}</p></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" data-confirm="${action}">${label}</button></div>`,'narrow')}

    // ---- Stock. Worked out from opening stock + purchases − bills + counted corrections, so every device agrees.
    let stockCache=null,stockSearch='',stockFilter='all';
    function stockRows(){if(stockCache)return stockCache;const m=new Map();const mv=k=>{let r=m.get(k);if(!r){r={in:0,out:0,cost:0};m.set(k,r)}return r};
      [...db.purchases].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(p=>(p.items||[]).forEach(x=>{const k=normPn(x.partNumber||'');if(!k)return;const r=mv(k);r.in+=num(x.qty);if(num(x.rate))r.cost=num(x.rate)}));

    function stockView(){const rows=stockRows();const low=rows.filter(r=>r.low).length;const value=rows.reduce((a,r)=>a+Math.max(0,r.qty)*r.cost,0);let list=rows;if(stockSearch){const q=stockSearch.toLowerCase();list=list.filter(r=>(r.partNumber+' '+r.description+' '+(r.location||'')).toLowerCase().includes(q))}if(stockFilter==='low')list=list.filter(r=>r.low);list=[...list].sort((a,b)=>(b.low-a.low)||String(a.description||'').localeCompare(String(b.description||'')));

    function showStock(id){const s=id?db.stock.find(x=>x.id===id):null;openModal(`<div class="modal-head"><div><h2>${s?'Edit stock part':'Track a part'}</h2><p>Stock is counted by part number</p></div><button class="close" data-close aria-label="Close">×</button></div><form id="stock-form" data-id="${s?esc(s.id):''}"><div class="modal-body"><div class="form-grid"><div><label>Part number *</label><input class="field" name="partNumber" required value="${esc(s?.partNumber||'')}" ${s?'readonly':''} placeholder="e.g. 335/G1419"></div><div><label>Description</label><input class="field" name="description" value="${esc(s?.description||'')}" placeholder="Fills in from the price list"></div><div><label>${s?'Opening stock (when you started)':'How many do you have now?'}</label><input class="field" name="opening" type="number" min="0" step="any" value="${esc(s?.opening??0)}"></div><div><label>Alert me below (min. qty)</label><input class="field" name="minQty" type="number" min="0" step="any" value="${esc(s?.minQty??1)}"></div><div><label>Rack / shelf</label><input class="field" name="location" value="${esc(s?.location||'')}" placeholder="e.g. A-3"></div><div><label>Cost price (optional)</label><input class="field" name="cost" type="number" min="0" step="0.01" value="${esc(s?.cost||'')}" placeholder="Used until you record a purchase"></div></div></div><div class="modal-foot">${s&&isOwner()?`<button type="button" class="btn danger" data-stock-remove="${esc(s.id)}">Stop tracking</button>`:'<span></span>'}<div style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></div></form>`,'narrow');setTimeout(()=>document.querySelector('#stock-form input:not([readonly])')?.focus(),30)}

></span>'}<div style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save purchase</button></div></div></form>`,'builder');refreshPTotals();setTimeout(()=>document.querySelector('#purchase-form [name=supplier]')?.focus(),30)}

    // ---- Reports (owner only)
    let rep={period:'month',from:'',to:''};
    function ymd(x){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
    function periodRange(){const d=new Date();const fy=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;switch(rep.period){case 'today':return[today(),today()];case 'month':return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];case 'last':return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];case 'fy':return[`${fy}-04-01`,`${fy+1}-03-31`];case 'lastfy':return[`${fy-1}-04-01`,`${fy}-03-31`];default:return[rep.from||today(),rep.to||today()]}}
    function reportData(){const [from,to]=periodRange();const inR=s=>!!s&&s>=from&&s<=to;const sales=bills().filter(i=>inR(i.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.number||'').localeCompare(b.number||''));
      const rates=new Map(),b2c=new Map(),daily=new Map(),parts=new Map();let salesTotal=0,salesTaxable=0,outTax=0;
      const rate=(m,r)=>{let o=m.get(r);if(!o){o={taxable:0,cgst:0,sgst:0,igst:0};m.set(r,o)}return o};
      sales.forEach(i=>{const t=totals(i);salesTotal+=t.total;const d=daily.get(i.date)||{count:0,total:0,collected:0};d.count++;d.total+=t.total;daily.set(i.date,d);
        (i.items||[]).forEach(x=>{const c=lineCalc(x,i.inclusive);salesTaxable+=c.taxable;outTax+=c.tax;for(const m of i.customerGstin?[rates]:[rates,b2c]){const o=rate(m,num(x.taxRate));o.taxable+=c.taxable;if(i.gstType==='inter')o.igst+=c.tax;else{o.cgst+=c.tax/2;o.sgst+=c.tax/2}}
          const k=x.kind==='Service'?'labour:'+(x.description||'').toLowerCase():normPn(x.partNumber||'')||'d:'+(x.description||'').toLowerCase();const p=parts.get(k)||{pn:x.partNumber||'',desc:x.description||'',labour:x.kind==='Service',qty:0,amount:0};p.qty+=num(x.qty);p.amount+=c.amount;parts.set(k,p)})});
      let collected=0;const byMode=new Map();bills().forEach(i=>{if((i.payments||[]).length)i.payments.forEach(p=>{if(inR(p.date)){collected+=num(p.amount);byMode.set(modeLabel(p.mode),(byMode.get(modeLabel(p.mode))||0)+num(p.amount));const d=daily.get(p.date)||{count:0,total:0,collected:0};d.collected+=num(p.amount);daily.set(p.date,d)}});else if(i.paid&&inR(i.paidAt||i.date)){const v=totals(i).total;collected+=v;byMode.set('Not recorded',(byMode.get('Not recorded')||0)+v);const k=i.paidAt||i.date;const d=daily.get(k)||{count:0,total:0,collected:0};d.collected+=v;daily.set(k,d)}});
      const purchases=db.purchases.filter(p=>inR(p.date));let buyTaxable=0,inTax=0,buyTotal=0;purchases.forEach(p=>{const t=pTotals(p);buyTaxable+=t.taxable;inTax+=t.tax;buyTotal+=t.total});
      const expenses=db.expenses.filter(x=>inR(x.date));const expTotal=expenses.reduce((a,x)=>a+num(x.amount),0);const expCats=new Map();expenses.forEach(x=>expCats.set(x.category||'Other',(expCats.get(x.category||'Other')||0)+num(x.amount)));
      return{byMode,from,to,sales,salesTotal,salesTaxable,outTax,rates,b2c,b2b:sales.filter(i=>i.customerGstin),daily,parts:[...parts.values()].sort((a,b)=>b.amount-a.amount),collected,purchases,buyTaxable,inTax,buyTotal,expTotal,expCats,profit:salesTaxable-buyTaxable-expTotal,due:bills().reduce((a,i)=>a+balance(i),0)}}
    function rateRows(m){return [...m].sort((a,b)=>a[0]-b[0])}
    function reportsView(){const r=reportData();const opt=(v,l)=>`<option value="${v}" ${rep.period===v?'selected':''}>${l}</option>`;const sum=(m,k)=>[...m.values()].reduce((a,o)=>a+o[k],0);
      const gstTable=m=>`<div class="table-wrap"><table><thead><tr><th>GST RATE</th><th class="right">TAXABLE VALUE</th><th class="right">CGST</th><th class="right">SGST</th><th class="right">IGST</th><th class="right">TOTAL TAX</th></tr></thead><tbody>${rateRows(m).map(([k,o])=>`<tr><td><b>${k}%</b></td><td class="num">${money(o.taxable)}</td><td class="num">${money(o.cgst)}</td><td class="num">${money(o.sgst)}</td><td class="num">${money(o.igst)}</td><td class="num"><b>${money(o.cgst+o.sgst+o.igst)}</b></td></tr>`).join('')}<tr style="background:#fafbfa"><td><b>Total</b></td><td class="num"><b>${money(sum(m,'taxable'))}</b></td><td class="num"><b>${money(sum(m,'cgst'))}</b></td><td class="num"><b>${money(sum(m,'sgst'))}</b></td><td class="num"><b>${money(sum(m,'igst'))}</b></td><td class="num"><b>${money(sum(m,'cgst')+sum(m,'sgst')+sum(m,'igst'))}</b></td></tr></tbody></table></div>`;
      const days=[...r.daily].sort((a,b)=>b[0].localeCompare(a[0]));const maxDay=Math.max(1,...days.map(d=>d[1].total));
      return `<div class="toolbar"><select id="rep-period" class="field" style="width:auto;min-width:170px">${opt('today','Today')}${opt('month','This month')}${opt('last','Last month')}${opt('fy','This financial year')}${opt('lastfy','Last financial year')}${opt('custom','Custom dates…')}</select>${rep.period==='custom'?`<input type="date" id="rep-from" class="field" style="width:auto" value="${esc(rep.from||r.from)}"><span class="muted">to</span><input type="date" id="rep-to" class="field" style="width:auto" value="${esc(rep.to||r.to)}">`:`<span class="muted" style="font-size:13px">${dateFmt(r.from)} – ${dateFmt(r.to)}</span>`}<span style="flex:1"></span><button class="btn" data-report-csv="sales">↓ Bills list</button></div>
        <div class="metrics"><div class="metric"><div class="metric-label">Sales</div><div class="metric-value">${money(r.salesTotal)}</div><div class="metric-note">${r.sales.length} bill${r.sales.length===1?'':'s'} · ${money(r.salesTaxable)} before GST</div></div><div class="metric"><div class="metric-label">Money collected</div><div class="metric-value">${money(r.collected)}</div><div class="metric-note">Still due (all time): ${money(r.due)}</div></div><div class="metric"><div class="metric-label">Purchases + expenses</div><div class="metric-value">${money(r.buyTotal+r.expTotal)}</div><div class="metric-note">${money(r.buyTotal)} parts · ${money(r.expTotal)} expenses</div></div><div class="metric"><div class="metric-label">Rough profit</div><div class="metric-value" style="color:${r.profit<0?'var(--red)':'var(--green)'}">${money(r.profit)}</div><div class="metric-note">Sales − purchases − expenses, before GST</div></div></div>
        <div class="grid-two"><section class="card list-card" style="margin-top:0"><div class="card-head"><div><div class="card-title">GST on sales (output tax)</div><div class="card-note">All bills in this period, by GST rate</div></div><button class="btn small" data-report-csv="gst">↓ Excel</button></div>${r.rates.size?gstTable(r.rates):'<div class="empty"><p>No bills in this period.</p></div>'}</section>
          <section class="card"><div class="card-title">GST to pay</div><div class="card-note">Estimate — confirm with your accountant</div><div class="totals" style="margin-top:14px"><div class="total-line"><span>GST collected on sales</span><b>${money(r.outTax)}</b></div><div class="total-line"><span>GST paid on purchases (input credit)</span><b>− ${money(r.inTax)}</b></div><div class="total-line final"><span>Net GST</span><span>${money(r.outTax-r.inTax)}</span></div></div><div class="helper">${r.purchases.length} purchase${r.purchases.length===1?'':'s'} recorded in this period.</div></section></div>
        <section class="card list-card"><div class="card-head"><div><div class="card-title">B2B bills (customers with GSTIN)</div><div class="card-note">For GSTR-1 table 4</div></div><button class="btn small" data-report-csv="b2b">↓ Excel</button></div>${r.b2b.length?`<div class="table-wrap"><table><thead><tr><th>GSTIN</th><th>CUSTOMER</th><th>BILL NO.</th><th>DATE</th><th class="right">TAXABLE</th><th class="right">GST</th><th class="right">BILL VALUE</th></tr></thead><tbody>${r.b2b.map(i=>{const t=totals(i);return `<tr><td><b>${esc(i.customerGstin)}</b></td><td>${esc(i.customerName)}</td><td>${esc(i.number)}</td><td>${dateFmt(i.date)}</td><td class="num">${money(t.subtotal)}</td><td class="num">${money(t.tax)}</td><td class="num"><b>${money(t.total)}</b></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty" style="padding:22px"><p>No bills to customers with a GSTIN in this period.</p></div>'}</section>
        <section class="card list-card"><div class="card-head"><div><div class="card-title">B2C sales (customers without GSTIN)</div><div class="card-note">For GSTR-1 table 7, by rate</div></div><button class="btn small" data-report-csv="b2c">↓ Excel</button></div>${r.b2c.size?gstTable(r.b2c):'<div class="empty" style="padding:22px"><p>No B2C sales in this period.</p></div>'}</section>
        <div class="grid-two"><section class="card list-card"><div class="card-head"><div><div class="card-title">Day by day</div></div><button class="btn small" data-report-csv="daily">↓ Excel</button></div>${days.length?`<div class="table-wrap"><table><thead><tr><th>DATE</th><th class="right">BILLS</th><th></th><th class="right">SALES</th><th class="right">COLLECTED</th></tr></thead><tbody>${days.map(([d,v])=>`<tr><td>${dateFmt(d)}</td><td class="num">${v.count}</td><td style="width:30%"><div class="hbar-track"><div style="width:${v.total/maxDay*100}%"></div></div></td><td class="num"><b>${money(v.total)}</b></td><td class="num">${money(v.collected)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:22px"><p>Nothing in this period.</p></div>'}</section>
          <section class="card list-card"><div class="card-head"><div><div class="card-title">Top parts &amp; labour</div><div class="card-note">By amount billed</div></div><button class="btn small" data-report-csv="parts">↓ Excel</button></div>${r.parts.length?`<div class="table-wrap"><table><thead><tr><th>ITEM</th><th class="right">QTY</th><th class="right">AMOUNT</th></tr></thead><tbody>${r.parts.slice(0,15).map(p=>`<tr><td class="wrap"><b>${esc(p.desc)}</b><div class="subcell">${p.labour?'Labour':esc(p.pn)}</div></td><td class="num">${p.qty}</td><td class="num"><b>${money(p.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:22px"><p>Nothing sold in this period.</p></div>'}</section></div>
        ${r.byMode.size?`<section class="card" style="margin-top:16px"><div class="card-head"><div><div class="card-title">Money collected by method</div><div class="card-note">Cash in hand vs. money in the bank</div></div><button class="btn small" data-report-csv="modes">↓ Excel</button></div>${[...r.byMode].sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="hbar"><div class="hbar-top"><span>${esc(m)}</span><b>${money(v)}</b></div><div class="hbar-track"><div style="width:${v/r.collected*100}%"></div></div></div>`).join('')}</section>`:''}
        ${r.expCats.size?`<section class="card" style="margin-top:16px"><div class="card-title" style="margin-bottom:12px">Expenses by category</div>${[...r.expCats].sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="hbar"><div class="hbar-top"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="hbar-track"><div style="width:${v/r.expTotal*100}%"></div></div></div>`).join('')}</section>`:''}
        <p class="helper" style="margin-top:16px">Rough profit doesn't count parts still on your shelves. Use the GST figures as a guide for filing — check them with your accountant.</p>`}
    function reportCsv(kind){const r=reportData();const tag=`${r.from}_to_${r.to}`;const gstRows=m=>[['GST rate %','Taxable value','CGST','SGST','IGST','Total tax'],...rateRows(m).map(([k,o])=>[k,o.taxable.toFixed(2),o.cgst.toFixed(2),o.sgst.toFixed(2),o.igst.toFixed(2),(o.cgst+o.sgst+o.igst).toFixed(2)])];
      if(kind==='gst')csvDownload(`gst-summary-${tag}.csv`,gstRows(r.rates));
      if(kind==='b2c')csvDownload(`b2c-${tag}.csv`,gstRows(r.b2c));
      if(kind==='b2b')csvDownload(`b2b-${tag}.csv`,[['GSTIN','Customer','Bill no.','Date','Taxable value','GST','Bill value','GST type'],...r.b2b.map(i=>{const t=totals(i);return[i.customerGstin,i.customerName,i.number,i.date,t.subtotal.toFixed(2),t.tax.toFixed(2),t.total.toFixed(2),i.gstType==='inter'?'IGST':'CGST+SGST']})]);
      if(kind==='daily')csvDownload(`daily-${tag}.csv`,[['Date','Bills','Sales','Collected'],...[...r.daily].sort((a,b)=>a[0].localeCompare(b[0])).map(([d,v])=>[d,v.count,v.total.toFixed(2),v.collected.toFixed(2)])]);
      if(kind==='parts')csvDownload(`items-sold-${tag}.csv`,[['Part no.','Description','Qty','Amount'],...r.parts.map(p=>[p.labour?'Labour':p.pn,p.desc,p.qty,p.amount.toFixed(2)])]);
      if(kind==='modes')csvDownload(`collections-by-method-${tag}.csv`,[['Paid by','Amount'],...[...r.byMode].map(([m,v])=>[m,v.toFixed(2)])]);
      if(kind==='sales')csvDownload(`bills-${tag}.csv`,[['Bill no.','Date','Customer','GSTIN','Taxable value','GST','Total','Received','Balance'],...r.sales.map(i=>{const t=totals(i);return[i.number,i.date,i.customerName,i.customerGstin,t.subtotal.toFixed(2),t.tax.toFixed(2),t.total.toFixed(2),received(i).toFixed(2),balance(i).toFixed(2)]})])}

    // ---- Events for stock, purchases, expenses and reports
    document.addEventListener('click',e=>{const t=e.target;
      if(t.closest('[data-low-stock]')){page='stock';stockFilter='low';render();return}
      if(t.closest('[data-stock-new]')){showStock();return}
      const se=t.closest('[data-stock-edit]');if(se){showStock(se.dataset.stockEdit);return}
      const sa=t.closest('[data-stock-adjust]');if(sa){showAdjust(sa.dataset.stockAdjust);return}
      const sr=t.closest('[data-stock-remove]');if(sr){db.stock=db.stock.filter(x=>x.id!==sr.dataset.stockRemove);save();closeModal();render();toast('Stopped tracking that part. Bills and purchases are unchanged.');return}
      if(t.closest('[data-stock-csv]')){csvDownload('stock-'+today()+'.csv',[['Part no.','Description','Rack','In stock','Min qty','Bought','Sold','Cost each','Stock value'],...stockRows().map(r=>[r.partNumber,r.description,r.location,r.qty,num(r.minQty),r.in,r.out,r.cost.toFixed(2),(Math.max(0,r.qty)*r.cost).toFixed(2)])]);return}
      if(t.closest('[data-purchase-new]')){showPurchase();return}
      const pr=t.closest('[data-purchase]');if(pr){showPurchase(pr.dataset.purchase);return}
      if(t.closest('[data-p-add]')){document.getElementById('p-lines').insertAdjacentHTML('beforeend',pLineRow());const r=document.getElementById('p-lines').lastElementChild;r.querySelector('.pp').focus();refreshPTotals();return}
      const prm=t.closest('.p-remove');if(prm){prm.closest('.p-row').remove();refreshPTotals();return}
      const dp=t.closest('[data-del-purchase]');if(dp){confirmModal('Delete this purchase?','Stock from this purchase will be taken off again.','purchase:'+dp.dataset.delPurchase);return}
      const de=t.closest('[data-del-expense]');if(de){db.expenses=db.expenses.filter(x=>x.id!==de.dataset.delExpense);save();render();toast('Expense removed.');return}
      if(t.closest('[data-exp-csv]')){csvDownload('expenses-'+expMonth+'.csv',[['Date','Category','Note','Paid by','Amount'],...db.expenses.filter(x=>(x.date||'').slice(0,7)===expMonth).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>[x.date,x.category,x.note,x.mode,num(x.amount).toFixed(2)])]);return}
      const rc=t.closest('[data-report-csv]');if(rc){reportCsv(rc.dataset.reportCsv);return}
    });
    document.addEventListener('input',e=>{const t=e.target;
      const searches={'stock-search':v=>stockSearch=v,'purchase-search':v=>purchaseSearch=v};if(searches[t.id]){searches[t.id](t.value);rerender();return}

    document.addEventListener('change',e=>{const t=e.target;
      if(t.id==='stock-filter'){stockFilter=t.value;render();return}
